name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions fixadas pelo SHA do commit (o comentário diz a versão).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Pacote do servidor
        run: node scripts/pack-server.mjs

      - name: Build do app de desktop (sem instalador)
        run: npm run build -w @riverfront/desktop
